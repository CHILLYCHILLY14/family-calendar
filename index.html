<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="description" content="Our shared family calendar, dashboard, needs list and picky-eater meal ideas." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Family Hub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      if (window.self !== window.top) document.documentElement.classList.add('is-embedded');
      try { var p = JSON.parse(localStorage.getItem('fh.prefs') || '{}'); var t = p.theme || 'auto'; if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = t; } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="icon" href="./assets/icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css?v=1" />
    <title>Family Hub</title>
  </head>
  <body>
    <div id="app"><div class="boot">🏡</div></div>
    <div id="modal-root"></div>
    <noscript>Family Hub needs JavaScript turned on.</noscript>
    <script type="module" src="./app.js?v=1"></script>
  </body>
</html>
